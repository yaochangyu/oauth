<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跨模組端到端真實場景循序圖</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">DIAGRAM DESIGN · SEQUENCE</p>
    <h1>跨模組端到端真實場景循序圖</h1>
    <svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cross-module-seq-title cross-module-seq-desc">
      <title id="cross-module-seq-title">跨模組端到端真實場景循序圖</title>
      <desc id="cross-module-seq-desc">展示使用者、第三方 App 與 AuthServer 之間完成註冊、登入、同意授權、Code換Token與資源存取的時間序列循序圖。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <!-- Actor 1: User -->
      <rect x="70" y="30" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
      <text x="150" y="55" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">使用者 (User)</text>
      <line x1="150" y1="70" x2="150" y2="640" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- Actor 2: Third-party App -->
      <rect x="370" y="30" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
      <text x="450" y="55" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">第三方 App (Client)</text>
      <line x1="450" y1="70" x2="450" y2="640" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- Actor 3: AuthServer -->
      <rect x="670" y="30" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
      <text x="750" y="55" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">AuthServer / API</text>
      <line x1="750" y1="70" x2="750" y2="640" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- Step 1: Register Account -->
      <path d="M 150 110 L 740 110" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <text x="445" y="102" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">1. POST /api/v1/account/register (建立會員帳號)</text>

      <path d="M 750 135 L 160 135" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 2" fill="none" marker-end="url(#arrow)"/>
      <text x="455" y="128" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist Mono', monospace">201 Created (帳號建立完成)</text>

      <!-- Step 2: User clicks Login on Client -->
      <path d="M 150 180 L 440 180" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <text x="295" y="172" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">2. 點擊「登入」按鈕</text>

      <!-- Step 3: Client redirects to Authorize with PKCE -->
      <path d="M 450 215 L 740 215" stroke="#2e5aa8" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
      <text x="595" y="207" fill="#2e5aa8" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">3. 跳轉 GET /connect/authorize (帶入 PKCE Challenge)</text>

      <!-- Step 4: Login & Consent -->
      <path d="M 150 265 L 740 265" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <text x="445" y="257" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">4. 帳號密碼登入 (POST /api/v1/account/login)</text>

      <path d="M 150 315 L 740 315" stroke="#eb6c36" stroke-width="1.5" fill="none" marker-end="url(#arrow-accent)"/>
      <text x="445" y="307" fill="#eb6c36" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">5. 同意授權 (POST /api/v1/connect/consent-accept)</text>

      <!-- Step 5: Redirect with Code -->
      <path d="M 750 365 L 460 365" stroke="#2e5aa8" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
      <text x="605" y="357" fill="#2e5aa8" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">6. 302 Redirect 回 redirect_uri?code=AUTH_CODE</text>

      <!-- Step 6: Exchange Code for Token (Focal) -->
      <rect x="360" y="400" width="410" height="100" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
      <path d="M 450 430 L 740 430" stroke="#eb6c36" stroke-width="1.5" fill="none" marker-end="url(#arrow-accent)"/>
      <text x="595" y="422" fill="#eb6c36" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">7. POST /connect/token (Code + Verifier + Secret)</text>

      <path d="M 750 470 L 460 470" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4 2" fill="none" marker-end="url(#arrow-accent)"/>
      <text x="605" y="462" fill="#eb6c36" font-size="10" text-anchor="middle" font-family="'Geist Mono', monospace">200 OK: { access_token, refresh_token }</text>

      <!-- Step 7: Access Resource -->
      <path d="M 450 535 L 740 535" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <text x="595" y="527" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">8. 存取資源 GET /connect/userinfo (Bearer Token)</text>

      <path d="M 750 570 L 460 570" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 2" fill="none" marker-end="url(#arrow)"/>
      <text x="605" y="562" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist Mono', monospace">200 OK: { sub, name, email }</text>

      <!-- Step 8: Return result to user -->
      <path d="M 450 610 L 160 610" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 2" fill="none" marker-end="url(#arrow)"/>
      <text x="305" y="602" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist Mono', monospace">顯示已登入個人首頁畫面</text>

    </svg>
  </div>
</body>
</html>
