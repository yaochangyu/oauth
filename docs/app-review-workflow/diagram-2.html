<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第三方應用狀態機流轉圖</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">DIAGRAM DESIGN · STATE MACHINE</p>
    <h1>第三方應用狀態機流轉圖</h1>
    <svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="app-review-state-title app-review-state-desc">
      <title id="app-review-state-title">第三方應用狀態機流轉圖</title>
      <desc id="app-review-state-desc">展示 InReview、Approved、Rejected、Suspended 狀態轉換與對應之 HTTP API 端點。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Transition: InReview -> Approved -->
      <path d="M 230 140 L 460 140" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <text x="345" y="125" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">核准 (Approve)</text>
      <text x="345" y="137" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">POST /api/v1/admin/apps/{id}/approve</text>

      <!-- Transition: InReview -> Rejected -->
      <path d="M 150 180 L 150 320" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <text x="210" y="245" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">駁回 (Reject)</text>
      <text x="210" y="260" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">POST .../{id}/reject</text>

      <!-- Transition: Approved -> Suspended -->
      <path d="M 520 180 L 520 320" stroke="#eb6c36" stroke-width="1.5" fill="none" marker-end="url(#arrow-accent)"/>
      <text x="440" y="245" fill="#eb6c36" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">強制停用 (Suspend)</text>
      <text x="440" y="260" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">POST .../{id}/suspend (吊銷Token)</text>

      <!-- Transition: Suspended -> Approved -->
      <path d="M 580 320 L 580 180" stroke="#2e5aa8" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
      <text x="660" y="245" fill="#2e5aa8" font-size="11" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">恢復上線 (Restore)</text>
      <text x="660" y="260" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">POST .../{id}/restore</text>

      <!-- State Node 1: InReview -->
      <rect x="70" y="100" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
      <text x="150" y="135" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">InReview</text>
      <text x="150" y="155" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist Mono', monospace">待審核狀態</text>

      <!-- State Node 2: Approved (Focal) -->
      <rect x="460" y="100" width="160" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="2"/>
      <text x="540" y="135" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">Approved</text>
      <text x="540" y="155" fill="#eb6c36" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">正常上線營運中</text>

      <!-- State Node 3: Rejected -->
      <rect x="70" y="320" width="160" height="80" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="150" y="355" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">Rejected</text>
      <text x="150" y="375" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist Mono', monospace">已駁回 (含退件原因)</text>

      <!-- State Node 4: Suspended -->
      <rect x="460" y="320" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
      <text x="540" y="355" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">Suspended</text>
      <text x="540" y="375" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist Mono', monospace">違規停用 (Token全數吊銷)</text>

      <!-- Legend -->
      <rect x="720" y="80" width="150" height="110" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
      <text x="735" y="105" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif">狀態說明</text>
      <circle cx="740" cy="125" r="4" fill="#2d3142"/>
      <text x="752" y="129" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans TC', sans-serif">初始審核流</text>
      <circle cx="740" cy="145" r="4" fill="#eb6c36"/>
      <text x="752" y="149" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans TC', sans-serif">違規處置 (級聯)</text>
      <circle cx="740" cy="165" r="4" fill="#2e5aa8"/>
      <text x="752" y="169" fill="#4f5d75" font-size="9" font-family="'Geist', 'Noto Sans TC', sans-serif">解封恢復</text>
    </svg>
  </div>
</body>
</html>
