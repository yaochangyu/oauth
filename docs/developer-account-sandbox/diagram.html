<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>開發者身分啟用與沙盒測試流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">DIAGRAM DESIGN · ARCHITECTURE &amp; FLOW</p>
    <h1>開發者身分啟用與沙盒測試流程</h1>
    <svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="developer-account-sandbox-title developer-account-sandbox-desc">
      <title id="developer-account-sandbox-title">開發者身分啟用與沙盒測試流程</title>
      <desc id="developer-account-sandbox-desc">展示一般會員開通為開發者身分，並透過沙盒工具組裝並輸出 PKCE 授權連線網址的完整流程。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      
      <!-- Connectors -->
      <path d="M 180 180 L 260 180" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <path d="M 420 180 L 500 180" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <path d="M 660 180 L 740 180" stroke="#eb6c36" stroke-width="1.2" fill="none" marker-end="url(#arrow-accent)"/>

      <!-- Node 1 -->
      <rect x="40" y="140" width="140" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="110" y="175" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">1. 啟用開發者身分</text>
      <text x="110" y="195" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist Mono', monospace">POST account/enable</text>

      <!-- Node 2 -->
      <rect x="260" y="140" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="175" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">2. 進入沙盒工具</text>
      <text x="340" y="195" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist Mono', monospace">Sandbox Web Tool</text>

      <!-- Node 3 -->
      <rect x="500" y="140" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="580" y="175" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">3. 帶入授權參數</text>
      <text x="580" y="195" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="'Geist Mono', monospace">Challenge / RedirectUri</text>

      <!-- Node 4 (Focal) -->
      <rect x="740" y="140" width="140" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="810" y="175" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">4. 輸出授權網址</text>
      <text x="810" y="195" fill="#eb6c36" font-size="10" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">200 OK AuthorizeUrl</text>

    </svg>
  </div>
</body>
</html>
