<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跨模組端到端完整業務生命週期</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">DIAGRAM DESIGN · ARCHITECTURE &amp; FLOW</p>
    <h1>跨模組端到端完整業務生命週期</h1>
    <svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cross-module-real-world-scenarios-title cross-module-real-world-scenarios-desc">
      <title id="cross-module-real-world-scenarios-title">跨模組端到端完整業務生命週期</title>
      <desc id="cross-module-real-world-scenarios-desc">展示從使用者註冊、發起 PKCE 授權、同意授權、換取 Token、存取受保護 API 到撤銷授權的完整生命週期。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      
      <!-- Connectors -->
      <path d="M 140 180 L 190 180" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <path d="M 330 180 L 380 180" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <path d="M 520 180 L 570 180" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <path d="M 710 180 L 760 180" stroke="#eb6c36" stroke-width="1.2" fill="none" marker-end="url(#arrow-accent)"/>

      <!-- Node 1 -->
      <rect x="20" y="140" width="120" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="80" y="175" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">1. 註冊與發起</text>
      <text x="80" y="195" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">Authorize + PKCE</text>

      <!-- Node 2 -->
      <rect x="190" y="140" width="140" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="175" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">2. 登入與同意</text>
      <text x="260" y="195" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">Consent Decision</text>

      <!-- Node 3 -->
      <rect x="380" y="140" width="140" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="450" y="175" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">3. Token 交換</text>
      <text x="450" y="195" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">Access / Refresh</text>

      <!-- Node 4 -->
      <rect x="570" y="140" width="140" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="175" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">4. 資源 API 存取</text>
      <text x="640" y="195" fill="#4f5d75" font-size="9" text-anchor="middle" font-family="'Geist Mono', monospace">Bearer Token 呼叫</text>

      <!-- Node 5 (Focal) -->
      <rect x="760" y="140" width="120" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="820" y="175" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist', 'Noto Sans TC', sans-serif">5. 撤銷與級聯作廢</text>
      <text x="820" y="195" fill="#eb6c36" font-size="9" font-weight="600" text-anchor="middle" font-family="'Geist Mono', monospace">Cascade Revoke</text>

    </svg>
  </div>
</body>
</html>
